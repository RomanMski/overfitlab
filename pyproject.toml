[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stressfold"
version = "0.2.0"
description = "Reproducible generalization stress tests for tabular models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StressFold contributors" }]
keywords = ["machine-learning", "overfitting", "robustness", "validation", "tabular"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
stressfold = "stressfold.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = [
  "error::FutureWarning:stressfold.*",
]

[tool.coverage.run]
source = ["stressfold"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
