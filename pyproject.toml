[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overfitlab"
version = "1.0.0"
description = "Measure how much of a backtest result came from searching rather than from skill."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roman Mirosenski" }]
keywords = ["backtesting", "overfitting", "quantitative-finance", "sharpe-ratio", "model-validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = [
  "error::FutureWarning:overfitlab.*",
]

[tool.coverage.run]
source = ["overfitlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
